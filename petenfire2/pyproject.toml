[project]
name = "petenfire2"
version = "0.1.0"
description = "Predicción de Incendios Forestales en Petén, Guatemala - Stacking Ensemble Approach"
requires-python = ">=3.11,<3.14"
authors = [
    { name = "PetenFire Team" }
]
license = { text = "MIT" }
keywords = ["wildfire", "remote-sensing", "guatemala", "peten", "geospatial", "machine-learning", "stacking"]

dependencies = [
    # Core científico
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "pyarrow>=16.0",
    # Geoespacial
    "geopandas>=1.0",
    "shapely>=2.0",
    "rasterio>=1.3",
    "xarray>=2024.1",
    "rioxarray>=0.15",
    "pyproj>=3.6",
    "fiona>=1.9",
    # Datos satelitales / APIs
    "requests>=2.31",
    "httpx>=0.27",
    "cdsapi>=0.7",
    "earthengine-api>=0.1.400",
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
    # ML - Stacking Ensemble
    "scikit-learn>=1.4",
    "category-encoders>=2.6",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "catboost>=1.2",
    "shap>=0.44",
    "imbalanced-learn>=0.12",
    # Visualización / Dashboard
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.20",
    "folium>=0.16",
    "streamlit>=1.35",
    "streamlit-folium>=0.20",
    # Utilidades
    "tqdm>=4.66",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "typer>=0.12",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "nbstripout>=0.7",
    "pre-commit>=3.7",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "ruff>=0.5",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "nbstripout>=0.7",
    "pre-commit>=3.7",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "notebooks/.ipynb_checkpoints", "reports", ".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "F401", "F841"]
"tests/*" = ["S101", "N803", "N806"]
"src/models/**" = ["N803", "N806"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = ["-ra", "--strict-markers", "--cov=src", "--cov-report=term-missing"]
markers = [
    "slow: tests lentos",
    "network: requiere internet",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
ignore_missing_imports = true
exclude = ["data/", "notebooks/", "reports/"]
