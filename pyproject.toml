[project]
name = "petenfire"
version = "0.1.0"
description = "Sistema Integrado de Predicción y Detección de Incendios Forestales para el Petén, Guatemala"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "PetenFire Team" }
]
license = { text = "MIT" }
keywords = ["wildfire", "remote-sensing", "guatemala", "peten", "geospatial", "machine-learning"]

dependencies = [
    # Core científico
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    # Geoespacial
    "geopandas>=1.0",
    "shapely>=2.0",
    "rasterio>=1.3",
    "xarray>=2024.1",
    "rioxarray>=0.15",
    "pyproj>=3.6",
    "fiona>=1.9",
    # Datos satelitales / APIs
    "requests>=2.31",
    "httpx>=0.27",
    "cdsapi>=0.7",
    "earthengine-api>=0.1.400",
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
    # ML clásico
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "imbalanced-learn>=0.12",
    # Deep Learning (M3)
    "torch>=2.2",
    "torchvision>=0.17",
    "ultralytics>=8.2",
    # Visualización / Dashboard
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.20",
    "folium>=0.16",
    "streamlit>=1.35",
    "streamlit-folium>=0.20",
    # Utilidades
    "tqdm>=4.66",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "nbstripout>=0.7",
    "pre-commit>=3.7",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# uv
# ---------------------------------------------------------------------------
[tool.uv]
dev-dependencies = [
    "ruff>=0.5",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "nbstripout>=0.7",
    "pre-commit>=3.7",
    "mypy>=1.10",
]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "data",
    "notebooks/.ipynb_checkpoints",
    "reports",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line-too-long (formatter handles)
    "B008",  # function calls in defaults (común en Typer/FastAPI)
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "F401", "F841"]
"tests/*" = ["S101", "N803", "N806"]
"src/models/**" = ["N803", "N806"]  # X_train, X_val, X_test son convencion ML (matriz de features)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:reports/coverage",
]
markers = [
    "slow: marca tests lentos (deselect con '-m \"not slow\"')",
    "network: requiere acceso a internet / APIs externas",
    "gpu: requiere GPU disponible",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["data/", "notebooks/", "reports/"]
